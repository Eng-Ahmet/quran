<div id="pantalla-ajustes" class="tab-content">
    <div class="card" style="border-color: var(--color-gold); text-align: center; padding: 30px 20px; background: rgba(212, 175, 55, 0.05); border: 2px dashed var(--color-gold);">
        <div style="font-size: 3em; margin-bottom: 15px;">🚧</div>
        <h3 style="color: var(--color-gold); font-size: 1.5em; margin-bottom: 10px;" data-i18n="coming_soon_title">قريباً</h3>
        <p style="color: #ffffff; font-size: 1em;" data-i18n="coming_soon_text">ميزة متابعة التقدم ستكون متوفرة قريباً.</p>
    </div>

    <div style="display:none;">
        <span id="stat-apuntes"></span>
        <span id="stat-tasbeeh"></span>
    </div>

    <div class="card">
        <h3 style="border-bottom: 1px solid var(--color-border); padding-bottom: 15px; margin-bottom: 20px;" data-i18n="settings_prefs">⚙️ الإعدادات</h3>
        <div class="form-group" style="margin-bottom: 30px;">
            <label data-i18n="settings_lang">🌐 تغيير اللغة</label>
            <select id="select-lang" onchange="cambiarIdioma(this.value, true)">
                <option value="ar">العربية (Árabe)</option>
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="form-group">
            <label data-i18n="settings_font">Aa حجم الخط</label>
            <div class="slider-control" style="margin-top: 15px; display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 14px;">A</span>
                <input type="range" min="14" max="24" value="16" id="fontSlider" oninput="cambiarTamanoLetra(this.value)" style="flex:1; accent-color: var(--color-gold);">
                <span style="font-size: 24px;">A</span>
            </div>
        </div>
    </div>
</div>

<div id="pantalla-inicio" class="tab-content active" dir="rtl">
    <h2 style="color: #4caf50; text-align: center; font-family: 'Amiri', serif; font-size: 3em; margin: 10px 0 25px 0; text-shadow: 0 2px 8px rgba(0,0,0,0.9);">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</h2>
    
    <div id="contenedor-historias" style="display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; margin-bottom: 25px;"></div>

    <div id="texto-fecha-hoy" style="text-align: center; color: var(--color-gold-light); font-size: 1.1em; font-weight: bold; margin-bottom: 25px;">
        اليوم: جاري الحساب...
    </div>

    <div class="card" id="tarjeta-tiempo" style="background: linear-gradient(135deg, rgba(46,125,50,0.15) 0%, var(--color-green-card) 100%); margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 id="tiempo-saludo" style="display: flex; align-items: center; gap: 10px; color: #4caf50;">
                    <span id="tiempo-icono" style="font-size: 1.3em;"><i class="fa-solid fa-moon"></i></span> <span id="tiempo-texto">ليلة طيبة</span>
                </h3>
                <p style="color: var(--color-text-muted);" data-i18n="home_day_glance">يومك بنظرة سريعة</p>
            </div>
        </div>
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-hands-praying" style="font-size: 1.3em; color: var(--color-gold);"></i>
                <span id="tiempo-azkar" style="font-weight: bold; color: white;">أذكار المساء</span>
            </div>
            <button class="btn-primary" id="btn-leer-tiempo" style="width: auto; padding: 10px 25px; font-size: 1em; background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color: white; border: none; border-radius: 10px; cursor: pointer;" data-i18n="home_read_btn">اقرأ</button>
        </div>
    </div>

    <!-- PREGUNTA DEL DÍA (سؤال اليوم الثقافي) -->
    <div class="card" id="tarjeta-pregunta">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin:0; color: white;" data-i18n="home_qotd">سؤال اليوم</h3>
            <i class="fa-solid fa-circle-question" style="color: var(--color-gold); font-size: 1.3em;"></i>
        </div>
        <p id="texto-pregunta-hoy" style="font-size: 1.3em; margin-bottom: 20px; font-weight: bold; color: var(--color-gold-light);">جاري تحميل السؤال...</p>
        <div class="form-group" id="contenedor-opciones" style="margin-bottom: 15px;"></div>
        <div id="resultado-pregunta-banner" style="display:none; margin-top: 15px;"></div>
    </div>
</div>
